[package]
name = "gamebanking"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Server-side Rust SDK for the Game Banking Engine"
authors = ["ShowBaba <samwise858@gmail.com>"]
license = "MIT"
repository = "https://github.com/ShowBaba/game-banking-sdk-rust"
homepage = "https://github.com/ShowBaba/game-banking-sdk-rust"
documentation = "https://docs.rs/gamebanking"
readme = "README.md"
keywords = ["banking", "games", "ledger", "sdk"]
categories = ["api-bindings", "game-development"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
chrono = { version = "0.4.31", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "sync"] }
